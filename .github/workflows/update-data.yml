# .github/workflows/update-data.yml 로 저장하세요
#
# 5분마다(사실상 GitHub Actions 스케줄의 최소 안정 주기) data.json을 새로 받아와서
# 같은 브랜치에 커밋 -> GitHub Pages가 그 변경사항을 자동으로 다시 배포합니다.
#
# 사전 준비
#   1) 저장소 Settings > Secrets and variables > Actions 에서
#      KIWOOM_APPKEY, KIWOOM_SECRETKEY 두 개를 등록
#   2) 저장소 Settings > Pages 에서 Source를
#      "Deploy from a branch" -> Branch: main / (root) 로 설정
#   3) 이 저장소 루트에 kiwoom_sector_watcher.py, build_once.py,
#      requirements.txt, sector-monitor-live.html, data.json 을 함께 커밋

name: Update sector data

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub Actions 스케줄 최소 단위(5분). 이보다 짧게는 못 돌립니다.
  workflow_dispatch: {}      # Actions 탭에서 "Run workflow"로 수동 실행도 가능

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest sector data
        env:
          KIWOOM_APPKEY: ${{ secrets.KIWOOM_APPKEY }}
          KIWOOM_SECRETKEY: ${{ secrets.KIWOOM_SECRETKEY }}
          KIWOOM_ENV: real
        run: python build_once.py

      - name: Commit updated data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "변경 없음, 커밋 생략"
          else
            git commit -m "chore: update data.json [skip ci]"
            git push
          fi
